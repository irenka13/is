<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Интерактивный глаз</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    background: #050a10;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 100%;
    max-width: 450px;
    aspect-ratio: 4 / 5;
    background: #050a10;
    overflow: hidden;
  }

  .poster-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  .bg-video {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 2;
  }

  /* === КРУТОЙ ПРЕЛОАДЕР === */
  .preloader {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: #050a10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }

  .preloader.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .eye-loader {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .ring-outer {
    position: absolute;
    width: 120px;
    height: 120px;
    border: 1px solid rgba(100, 180, 255, 0.15);
    border-top-color: rgba(100, 180, 255, 0.8);
    border-radius: 50%;
    animation: rotateCW 3s linear infinite;
    box-shadow: 0 0 20px rgba(100, 180, 255, 0.2);
  }

  .ring-middle {
    position: absolute;
    width: 85px;
    height: 85px;
    border: 1px solid rgba(100, 180, 255, 0.1);
    border-bottom-color: rgba(150, 220, 255, 0.7);
    border-radius: 50%;
    animation: rotateCCW 2s linear infinite;
  }

  .ring-inner {
    position: absolute;
    width: 50px;
    height: 50px;
    border: 1px solid rgba(100, 180, 255, 0.2);
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }

  .pupil {
    position: absolute;
    width: 16px;
    height: 16px;
    background: radial-gradient(circle, rgba(180, 220, 255, 0.9) 0%, rgba(100, 180, 255, 0.4) 60%, transparent 100%);
    border-radius: 50%;
    animation: pupilPulse 1.5s ease-in-out infinite;
    box-shadow: 0 0 15px rgba(100, 180, 255, 0.6);
  }

  .scan-line {
    position: absolute;
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(100, 180, 255, 0.8) 50%, transparent 100%);
    animation: scan 2s ease-in-out infinite;
    box-shadow: 0 0 8px rgba(100, 180, 255, 0.5);
  }

  .loading-text {
    margin-top: 30px;
    color: rgba(180, 220, 255, 0.6);
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 300;
    animation: fadeInOut 2s ease-in-out infinite;
  }

  @keyframes rotateCW {
    to { transform: rotate(360deg); }
  }

  @keyframes rotateCCW {
    to { transform: rotate(-360deg); }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  @keyframes pupilPulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.3); opacity: 1; }
  }

  @keyframes scan {
    0% { transform: translateY(-60px); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(60px); opacity: 0; }
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  .center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100px;
    height: 100px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 10;
    animation: centerPulse 3s ease-in-out infinite;
  }

  @keyframes centerPulse {
    0%, 100% { 
      transform: translate(-50%, -50%) scale(1);
      background: rgba(255, 255, 255, 0.02);
      border-color: rgba(255, 255, 255, 0.06);
    }
    50% { 
      transform: translate(-50%, -50%) scale(1.08);
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.12);
    }
  }

  .hotspot {
    position: absolute;
    width: 26px;
    height: 26px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    cursor: pointer;
    z-index: 10;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .hotspot.visible { opacity: 1; }

  .hotspot::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 6px;
    background: rgba(255, 255, 255, 0.35);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: dotPulse 2s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
    50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.2; }
  }

  .spot-cornea  { top: 18%; left: 50%; }
  .spot-iris    { top: 50%; left: 22%; }
  .spot-retina  { top: 50%; left: 78%; }
  .spot-lens    { top: 82%; left: 50%; }

  .popup {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 220px;
    aspect-ratio: 16 / 9;
    background: rgba(10, 15, 20, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    overflow: hidden;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.85);
    transition: opacity 0.3s ease, transform 0.3s ease;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(12px);
  }

  .popup.active {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  .popup video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .close-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 24px;
    height: 24px;
    background: rgba(0, 0, 0, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 50%;
    color: #fff;
    font-size: 14px;
    line-height: 22px;
    text-align: center;
    cursor: pointer;
    z-index: 21;
  }

  .sound-btn {
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 24px;
    height: 24px;
    background: rgba(0, 0, 0, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 50%;
    color: #fff;
    font-size: 12px;
    line-height: 22px;
    text-align: center;
    cursor: pointer;
    z-index: 21;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="scene" id="scene">

  <!-- ПРЕЛОАДЕР -->
  <div class="preloader" id="preloader">
    <div class="eye-loader">
      <div class="ring-outer"></div>
      <div class="ring-middle"></div>
      <div class="ring-inner"></div>
      <div class="pupil"></div>
      <div class="scan-line"></div>
    </div>
    <div class="loading-text">Инициализация</div>
  </div>

  <!-- Картинка-заглушка -->
  <img class="poster-img" id="posterImg" src="poster.jpg" alt="Eye">

  <!-- Первое видео: живой глаз -->
  <video class="bg-video hidden" id="idleVideo" loop muted playsinline webkit-playsinline preload="auto">
    <source src="eye-idle.mp4" type="video/mp4">
  </video>

  <div class="center-dot hidden" id="centerDot"></div>

  <!-- Второе видео: разлет (БЕЗ muted — со звуком!) -->
  <video class="bg-video hidden" id="explodeVideo" playsinline webkit-playsinline preload="auto">
    <source src="eye-explode.mp4" type="video/mp4">
  </video>

  <div class="hotspot spot-cornea hidden" data-target="cornea"></div>
  <div class="hotspot spot-iris hidden" data-target="iris"></div>
  <div class="hotspot spot-retina hidden" data-target="retina"></div>
  <div class="hotspot spot-lens hidden" data-target="lens"></div>

  <div class="popup" id="popup">
    <div class="close-btn" id="closeBtn">✕</div>
    <div class="sound-btn" id="soundBtn"></div>
    <video id="popupVideo" loop playsinline webkit-playsinline preload="auto"></video>
  </div>

</div>

<script>
  const videoMap = {
    cornea: 'video-cornea.mp4',
    iris:   'video-iris.mp4',
    retina: 'video-retina.mp4',
    lens:   'video-lens.mp4'
  };

  const centerDot    = document.getElementById('centerDot');
  const idleVideo    = document.getElementById('idleVideo');
  const explodeVideo = document.getElementById('explodeVideo');
  const posterImg    = document.getElementById('posterImg');
  const hotspots     = document.querySelectorAll('.hotspot');
  const popup        = document.getElementById('popup');
  const popupVideo   = document.getElementById('popupVideo');
  const closeBtn     = document.getElementById('closeBtn');
  const soundBtn     = document.getElementById('soundBtn');
  const scene        = document.getElementById('scene');
  const preloader    = document.getElementById('preloader');

  let isMuted = false;
  let idleReady = false;

  function hidePreloader() {
    preloader.classList.add('fade-out');
  }

  posterImg.addEventListener('load', () => {
    console.log('✅ Картинка загружена');
    setTimeout(hidePreloader, 500);
  });

  posterImg.addEventListener('error', () => {
    console.log('⚠️ Картинка не загрузилась');
    setTimeout(hidePreloader, 500);
  });

  idleVideo.addEventListener('canplaythrough', () => {
    console.log('✅ Первое видео готово');
    idleReady = true;
    idleVideo.classList.remove('hidden');
    centerDot.classList.remove('hidden');
    posterImg.classList.add('hidden');
    hidePreloader();
    idleVideo.play().catch(e => console.log('Play error:', e));
  });

  idleVideo.addEventListener('error', () => {
    console.log('❌ Видео не загрузилось');
    centerDot.classList.remove('hidden');
    hidePreloader();
  });

  window.addEventListener('load', () => {
    idleVideo.load();
    setTimeout(() => {
      if (!idleReady) {
        console.log('⏱️ Таймаут');
        centerDot.classList.remove('hidden');
        hidePreloader();
      }
    }, 3000);
  });

  // Клик по центру → разлет СО ЗВУКОМ
  centerDot.addEventListener('click', () => {
    console.log('👆 Клик по центру');
    
    posterImg.classList.add('hidden');
    idleVideo.classList.add('hidden');
    idleVideo.pause();
    centerDot.classList.add('hidden');

    explodeVideo.classList.remove('hidden');
    explodeVideo.muted = false;  // ВКЛЮЧАЕМ ЗВУК
    explodeVideo.volume = 1.0;   // Максимальная громкость
    explodeVideo.play()
      .then(() => console.log('🔊 Видео разлета играет со звуком'))
      .catch(e => console.log('❌ Ошибка запуска:', e));

    setTimeout(() => {
      hotspots.forEach(h => h.classList.remove('hidden'));
    }, 3000);
  });

  hotspots.forEach(hotspot => {
    hotspot.addEventListener('click', (e) => {
      e.stopPropagation();
      openPopup(hotspot.dataset.target);
    });
  });

  closeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closePopup();
  });

  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    isMuted = !isMuted;
    popupVideo.muted = isMuted;
    soundBtn.textContent = isMuted ? '' : '🔊';
  });

  scene.addEventListener('click', (e) => {
    if (!popup.contains(e.target) && !e.target.classList.contains('hotspot')) {
      closePopup();
    }
  });

  function openPopup(target) {
    popupVideo.pause();
    popupVideo.src = '';
    popupVideo.src = videoMap[target];
    popupVideo.muted = isMuted;
    popupVideo.load();
    popup.classList.add('active');

    popupVideo.addEventListener('canplay', function onCanPlay() {
      popupVideo.removeEventListener('canplay', onCanPlay);
      popupVideo.play().catch(err => {
        popupVideo.muted = true;
        isMuted = true;
        soundBtn.textContent = '🔇';
      });
    });
  }

  function closePopup() {
    popup.classList.remove('active');
    setTimeout(() => {
      popupVideo.pause();
      popupVideo.src = '';
    }, 300);
  }
</script>

</body>
</html>
